<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
<title id="title">AIOps overview</title><desc id="desc">Operational telemetry flows through data engineering and AI analytics into incident insights and response.</desc>
