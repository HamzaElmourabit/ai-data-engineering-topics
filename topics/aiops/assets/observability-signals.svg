<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
<title id="title">Observability signals in AIOps</title><desc id="desc">Logs, metrics, traces, events and topology metadata provide complementary evidence for incident investigation.</desc>
<rect width="1200" height="420" rx="24" fill="#f4f7fb"/><text x="600" y="58" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#172b4d" text-anchor="middle">One incident, multiple signals</text>
<g font-family="Arial,sans-serif" text-anchor="middle">
<g><rect x="45" y="115" width="190" height="150" rx="16" fill="#fff" stroke="#94a9c8" stroke-width="2"/><text x="140" y="160" font-size="25" font-weight="700" fill="#245b91">LOGS</text><text x="140" y="198" font-size="17" fill="#344563">Timeout errors</text><text x="140" y="225" font-size="15" fill="#5e6c84">What happened?</text></g>
<g><rect x="275" y="115" width="190" height="150" rx="16" fill="#fff" stroke="#94a9c8" stroke-width="2"/><text x="370" y="160" font-size="25" font-weight="700" fill="#245b91">METRICS</text><text x="370" y="198" font-size="17" fill="#344563">Latency, CPU</text><text x="370" y="225" font-size="15" fill="#5e6c84">How much / when?</text></g>
<g><rect x="505" y="115" width="190" height="150" rx="16" fill="#fff" stroke="#94a9c8" stroke-width="2"/><text x="600" y="160" font-size="25" font-weight="700" fill="#245b91">TRACES</text><text x="600" y="198" font-size="17" fill="#344563">Slow DB span</text><text x="600" y="225" font-size="15" fill="#5e6c84">Where is it slow?</text></g>
<g><rect x="735" y="115" width="190" height="150" rx="16" fill="#fff" stroke="#94a9c8" stroke-width="2"/><text x="830" y="160" font-size="25" font-weight="700" fill="#245b91">EVENTS</text><text x="830" y="198" font-size="17" fill="#344563">Recent deployment</text><text x="830" y="225" font-size="15" fill="#5e6c84">What changed?</text></g>
<g><rect x="965" y="115" width="190" height="150" rx="16" fill="#fff" stroke="#94a9c8" stroke-width="2"/><text x="1060" y="160" font-size="25" font-weight="700" fill="#245b91">TOPOLOGY</text><text x="1060" y="198" font-size="17" fill="#344563">Service dependencies</text><text x="1060" y="225" font-size="15" fill="#5e6c84">What is connected?</text></g>
</g>
<path d="M140 280 V315 H1060 V280 M370 280 V315 M600 280 V315 M830 280 V315 M1060 280 V315" fill="none" stroke="#5276a8" stroke-width="2.5"/><rect x="390" y="335" width="420" height="58" rx="14" fill="#dceaff" stroke="#5276a8" stroke-width="2"/><text x="600" y="371" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#173b67" text-anchor="middle">Correlated incident context</text>
</svg>