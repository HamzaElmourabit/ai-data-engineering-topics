<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
  <title id="title">Illustrative points where training and serving can diverge</title>
  <desc id="desc">A left-to-right data path from source records through feature construction, preprocessing, schema and serialization, and the model input. Training and serving paths can differ at each stage. The diagram is illustrative, not exhaustive.</desc>
  <defs>
    <style>
      text { font-family: Inter, "Segoe UI", Arial, sans-serif; fill: #e8eef8; }
      .title { font-size: 30px; font-weight: 700; }
      .label { font-size: 17px; font-weight: 700; }
      .detail { font-size: 14px; fill: #b7c3d5; }
      .muted { font-size: 15px; fill: #9eacc2; }
      .card { fill: #0b1a2c; stroke: #1c3855; stroke-width: 2; }
      .arrow { stroke: #18d6ce; stroke-width: 3; fill: none; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#18d6ce"/>
    </marker>
  </defs>
  <rect width="1200" height="600" rx="26" fill="#030b18"/>
  <text x="54" y="65" class="title">Where can the paths diverge?</text>
  <text x="55" y="96" class="muted">Illustrative checkpoints—not a diagnosis of any particular system.</text>

  <rect x="48" y="193" width="174" height="130" rx="16" class="card"/>
  <text x="135" y="232" text-anchor="middle" class="label">Source data</text>
  <text x="135" y="263" text-anchor="middle" class="detail">availability</text>
  <text x="135" y="285" text-anchor="middle" class="detail">time reference</text>

  <rect x="275" y="193" width="174" height="130" rx="16" class="card"/>
  <text x="362" y="232" text-anchor="middle" class="label">Feature building</text>
  <text x="362" y="263" text-anchor="middle" class="detail">definition</text>
  <text x="362" y="285" text-anchor="middle" class="detail">aggregation window</text>

  <rect x="502" y="193" width="174" height="130" rx="16" class="card"/>
  <text x="589" y="232" text-anchor="middle" class="label">Preprocessing</text>
  <text x="589" y="263" text-anchor="middle" class="detail">scaling and encoding</text>
  <text x="589" y="285" text-anchor="middle" class="detail">null behavior</text>

  <rect x="729" y="193" width="174" height="130" rx="16" class="card"/>
  <text x="816" y="232" text-anchor="middle" class="label">Schema / transport</text>
  <text x="816" y="263" text-anchor="middle" class="detail">names and types</text>
  <text x="816" y="285" text-anchor="middle" class="detail">serialization</text>

  <rect x="956" y="193" width="196" height="130" rx="16" class="card"/>
  <text x="1054" y="232" text-anchor="middle" class="label">Model input</text>
  <text x="1054" y="263" text-anchor="middle" class="detail">representation</text>
  <text x="1054" y="285" text-anchor="middle" class="detail">consumed at inference</text>

  <path d="M 222 258 H 269" class="arrow" marker-end="url(#arrow)"/>
  <path d="M 449 258 H 496" class="arrow" marker-end="url(#arrow)"/>
  <path d="M 676 258 H 723" class="arrow" marker-end="url(#arrow)"/>
  <path d="M 903 258 H 950" class="arrow" marker-end="url(#arrow)"/>

  <text x="600" y="384" text-anchor="middle" class="label" fill="#ff9f1c">Compare training and serving at meaningful boundaries</text>
  <path d="M 135 428 H 1054" stroke="#ff9f1c" stroke-width="2" stroke-dasharray="8 8" fill="none"/>
  <path d="M 135 408 V 448 M 362 408 V 448 M 589 408 V 448 M 816 408 V 448 M 1054 408 V 448" stroke="#ff9f1c" stroke-width="2"/>

  <text x="55" y="502" class="muted">A matching field name does not alone establish matching meaning.</text>
  <text x="55" y="535" class="muted">Compare definitions, values, units, missingness, and time semantics as appropriate.</text>
</svg>
