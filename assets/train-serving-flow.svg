<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">Training and serving pipeline alignment</title>
  <desc id="desc">Training data and production requests pass through aligned feature and preprocessing steps before model training and inference. Production inputs, predictions, and later labels are monitored.</desc>
  <defs>
    <style>
      text { font-family: Inter, "Segoe UI", Arial, sans-serif; fill: #e8eef8; }
      .muted { fill: #9eacc2; }
      .title { font-size: 30px; font-weight: 700; }
      .label { font-size: 19px; font-weight: 650; }
      .small { font-size: 15px; }
      .card { fill: #0b1a2c; stroke: #1c3855; stroke-width: 2; }
      .cyan { stroke: #18d6ce; }
      .orange { stroke: #ff9f1c; }
      .arrow { fill: none; stroke-width: 3; }
    </style>
    <marker id="arrow-cyan" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#18d6ce"/>
    </marker>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#ff9f1c"/>
    </marker>
  </defs>
  <rect width="1200" height="680" rx="26" fill="#030b18"/>
  <text x="54" y="66" class="title">One model, two data paths</text>
  <text x="55" y="98" class="small muted">Align input preparation across training and production inference.</text>

  <rect x="54" y="145" width="185" height="92" rx="16" class="card"/>
  <text x="146" y="183" text-anchor="middle" class="label">Training data</text>
  <text x="146" y="211" text-anchor="middle" class="small muted">examples</text>

  <rect x="54" y="299" width="185" height="92" rx="16" class="card"/>
  <text x="146" y="337" text-anchor="middle" class="label">Live requests</text>
  <text x="146" y="365" text-anchor="middle" class="small muted">production inputs</text>

  <rect x="321" y="190" width="255" height="158" rx="18" class="card cyan"/>
  <text x="448" y="233" text-anchor="middle" class="label">Shared input contract</text>
  <text x="448" y="269" text-anchor="middle" class="small">Feature definitions</text>
  <text x="448" y="296" text-anchor="middle" class="small">Preprocessing and encoding</text>
  <text x="448" y="323" text-anchor="middle" class="small">Types and missing values</text>

  <path d="M 239 191 H 278 Q 300 191 321 232" class="arrow cyan" marker-end="url(#arrow-cyan)"/>
  <path d="M 239 345 H 278 Q 300 345 321 305" class="arrow cyan" marker-end="url(#arrow-cyan)"/>

  <rect x="660" y="145" width="205" height="92" rx="16" class="card"/>
  <text x="762" y="183" text-anchor="middle" class="label">Model training</text>
  <text x="762" y="211" text-anchor="middle" class="small muted">prepared examples</text>
  <rect x="660" y="299" width="205" height="92" rx="16" class="card"/>
  <text x="762" y="337" text-anchor="middle" class="label">Inference</text>
  <text x="762" y="365" text-anchor="middle" class="small muted">prepared request</text>
  <path d="M 576 232 H 660" class="arrow cyan" marker-end="url(#arrow-cyan)"/>
  <path d="M 576 305 H 660" class="arrow cyan" marker-end="url(#arrow-cyan)"/>

  <rect x="938" y="299" width="208" height="92" rx="16" class="card orange"/>
  <text x="1042" y="337" text-anchor="middle" class="label">Prediction</text>
  <text x="1042" y="365" text-anchor="middle" class="small muted">production output</text>
  <path d="M 865 345 H 938" class="arrow orange" marker-end="url(#arrow-orange)"/>

  <rect x="321" y="475" width="825" height="124" rx="18" class="card orange"/>
  <text x="352" y="516" class="label">Production monitoring</text>
  <text x="352" y="550" class="small">Observe input quality and predictions.</text>
  <text x="352" y="577" class="small muted">Evaluate predictive performance when suitable labels become available.</text>
  <path d="M 1042 391 V 437 Q 1042 455 1020 475" class="arrow orange" marker-end="url(#arrow-orange)"/>

  <text x="55" y="643" class="small muted">Parity is about consistent meaning and inputs—not necessarily identical implementations.</text>
</svg>
